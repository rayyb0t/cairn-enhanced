# The repair agent's own configuration, for a host install (copy to /etc/cairn-repair/repair.yaml).
# It holds no server address, project list, model or key: the agent reads those from the dispatcher's settings
# file, <transcripts.root>/agent-settings.json, which the dispatcher writes from the repair: section of
# dispatch.yaml at its start. Replace every <...> placeholder; an unedited one stops the agent at startup.

token_file: "/etc/cairn-repair/agent.token"          # or token_env: CAIRN_REPAIR_AGENT_TOKEN; the agent role's token
server_api_key_file: null                            # dev-0.3.0 port only: sent as X-API-Key
server_ca_bundle: null                               # optional CA file for an https server URL; no proxy is ever used
dispatch_config_to_check: "/home/<you>/cairn/dispatch.yaml"   # required: the dispatcher's dispatch.yaml, which the agent must not be able to read
isolation:
  unreadable_paths:                                  # more absolute paths this agent must not be able to read
    - "/home/<you>/cairn/secrets/repair-dispatcher.token"
poll_interval: 5                                     # seconds, 2-30
max_concurrent_reviews: 4                            # 1-16
transcripts:
  root: "/var/lib/cairn-repair/transcripts"          # the dispatcher's transcript_root, read-only here; holds the settings file
  max_bytes: 67108864                                # 64 MiB, the dispatcher's cap
  max_staleness_seconds: 45                          # how much older than the window's opening the copy's last check may be
digest:
  max_tokens_estimate: 8000                          # the digest budget; a reviewer's context_window can lower it
state:
  dir: "/var/lib/cairn-repair/state"                 # the agent's own folder (cairn-repair, 0700): its reviewer pin
